name: AI Code Review (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      # 1. Сначала делаем checkout с полной историей
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Теперь, когда .git существует, явно получаем base-ветку
      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Используем shippie вместо code-review-gpt
      - name: Run Code Review via OpenRouter
        run: npx shippie review --ci=github --base=${{ github.base_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_BASE: "https://openrouter.ai/api/v1"
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: "meta-llama/llama-3.3-70b-instruct:free"