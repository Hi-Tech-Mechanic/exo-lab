name: AI Code Review (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch explicitly
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔍 Диагностика: проверяем, видит ли git изменения
      - name: Check for changes
        id: check_diff
        run: |
          echo "Checking diff between ${{ github.base_ref }} and HEAD..."
          DIFF_STATS=$(git diff --stat ${{ github.base_ref }}...HEAD)
          echo "diff_stats<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF_STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ -z "$DIFF_STATS" ]; then
            echo "⚠️ NO CHANGES DETECTED! Review will be skipped."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Changes found:"
            echo "$DIFF_STATS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug GitHub env vars
        run: |
          echo "BASE_SHA from context: ${{ github.event.pull_request.base.sha }}"
          echo "HEAD_SHA from context: ${{ github.event.pull_request.head.sha }}"
          echo "GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          echo "Checking if event file exists:"
          cat $GITHUB_EVENT_PATH | jq '.pull_request | {base_sha: .base.sha, head_sha: .head.sha}' 2>/dev/null || echo "Event file not found or invalid"

      - name: Run Code Review via OpenRouter
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npx shippie@latest review --ci=github --platform=github --base=${{ github.base_ref }} --head=${{ github.head_ref }} --provider=openrouter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: "true"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # ← Используйте правильное имя переменной
          MODEL: "meta-llama/llama-3.3-70b-instruct:free"