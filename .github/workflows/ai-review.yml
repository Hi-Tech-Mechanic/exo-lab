name: AI Code Review (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Code Review via OpenRouter
        run: npx code-review-gpt review --ci=github --base=origin/${{ github.base_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подменяем стандартный адрес OpenAI на OpenRouter:
          OPENAI_API_BASE: "https://openrouter.ai"
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Указываем, какую именно модель вызвать с OpenRouter:
          MODEL: "meta-llama/llama-3.3-70b-instruct:free"
